name: Answer-share probe

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Hard cap on provider API calls (MAX_CALLS)"
        type: string
        default: "1200"
      date:
        description: "Probe date YYYY-MM-DD (UTC today if empty)"
        type: string
        default: ""
      n:
        description: "Repeats per prompt per provider"
        type: string
        default: "3"

concurrency:
  group: answer-share-probe
  cancel-in-progress: false

# Read-only on the public repo so this job cannot push snapshots here.
permissions:
  contents: read

env:
  DATA_REPO: Verdent06/agentstore-radar-data
  DATA_DIR: ${{ github.workspace }}/.radar-data/data

jobs:
  answer-share:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout public collector
        uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: Verdent06/agentstore-radar-data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          path: .radar-data
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run weekly answer-share probe
        env:
          DATA_DIR: ${{ env.DATA_DIR }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MAX_CALLS: ${{ github.event.inputs.max_calls || '1200' }}
          ANSWER_SHARE_N: ${{ github.event.inputs.n || '3' }}
        run: |
          DATE_FLAG=()
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_FLAG=(--date "${{ github.event.inputs.date }}")
          fi
          npm run answer-share -- --data "$DATA_DIR" "${DATE_FLAG[@]}"
          npm run answer-share:report -- --data "$DATA_DIR" "${DATE_FLAG[@]}"

      - name: Commit answer-share snapshot to private data repo
        working-directory: .radar-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No answer-share changes"
          else
            DATE=$(date -u +%F)
            git commit -m "data: answer-share ${DATE}"
            git push
          fi
