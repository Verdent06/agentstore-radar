name: Collect snapshots

on:
  schedule:
    # npm only. Minute 20, off the :00/:15/:30 cluster. A cold scoped catalog
    # at one request per 1.8s is about 318 minutes, so a start near 00:20 UTC
    # still finishes before the next midnight after a 6–8h Actions delay
    # (00:20 + 8h + 318m ≈ 13:38 UTC).
    - cron: "20 0 * * *"
    # Primary daily collect (UTC morning). Off the :00/:15/:17/:30 cluster that
    # GitHub Actions delays under load (the 06:17 job was starting ~13:08).
    # GitHub still often delivers this 6–8h late, and the 2026-11-04 05:41
    # trigger never created a run. The 08:47 cron below is the backup.
    - cron: "41 5 * * *"
    # Morning backup, off the hour. --if-incomplete collects only when the core
    # sources (mcp-registry, github, npm) are incomplete. Smithery, gemini-cli,
    # and pypi do not trigger this rerun. This job does not run the npm lane.
    - cron: "47 8 * * *"
    # Same-day backstop. Same --if-incomplete core check as the morning backup.
    # Does not run the npm lane.
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      seed_only:
        description: "Copy public-repo data/ history into the private data repo; do not collect"
        type: boolean
        default: false
      if_incomplete:
        description: "Only collect if core sources (mcp-registry, github, npm) are incomplete"
        type: boolean
        default: false
      force:
        description: "Re-collect even if today's snapshot is already complete (overwrites that day)"
        type: boolean
        default: false
      skip_push:
        description: "Collect without pushing to the private data repo (branch verification)"
        type: boolean
        default: false
      sources:
        description: "Comma-separated sources to collect (empty collects every source). npm always runs in the npm job."
        type: string
        default: ""

concurrency:
  group: collect-snapshots
  cancel-in-progress: false

# Read-only on the public repo so this job cannot push snapshots here.
# issues: write is for collector-missed alerts on this repo.
permissions:
  contents: read
  issues: write

env:
  DATA_REPO: Verdent06/agentstore-radar-data
  DATA_DIR: ${{ github.workspace }}/.radar-data/data
  COLLECTOR_ISSUE_REPO: Verdent06/agentstore-radar
  IS_BACKSTOP: ${{ github.event.schedule == '23 19 * * *' || github.event.schedule == '47 8 * * *' }}
  # Every source except npm. The npm lane is only the npm job, on one runner.
  NON_NPM_SOURCES: mcp-registry,smithery,gemini-cli,github,pypi

jobs:
  collect:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '41 5 * * *' ||
          github.event.schedule == '47 8 * * *' ||
          github.event.schedule == '23 19 * * *' }}
    runs-on: ubuntu-latest
    # GitHub-hosted max is 6h. npm is not in this job.
    timeout-minutes: 360
    steps:
      - name: Checkout public collector
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: Verdent06/agentstore-radar-data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          path: .radar-data
          fetch-depth: 0

      - name: Seed private repo from public data/ history
        run: bash scripts/seed-data-repo.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.radar-data"

      - uses: actions/setup-node@v4
        if: ${{ inputs.seed_only != true }}
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
        if: ${{ inputs.seed_only != true }}

      - name: Skip backstop when core sources are already complete
        id: gate
        run: |
          if [[ "${IS_BACKSTOP}" != "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATE=$(date -u +%F)
          npx tsx scripts/if-incomplete-gate.ts "$DATA_DIR" "$DATE"

      - name: Collect sanctioned public snapshots
        id: collect
        if: ${{ inputs.seed_only != true && steps.gate.outcome == 'success' && steps.gate.outputs.skip != 'true' }}
        timeout-minutes: 330
        env:
          DATA_DIR: ${{ env.DATA_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          COLLECT_SOURCES: ${{ inputs.sources }}
          NON_NPM_SOURCES: ${{ env.NON_NPM_SOURCES }}
        run: |
          FILTERED=""
          if [[ -n "$COLLECT_SOURCES" ]]; then
            IFS=',' read -ra PARTS <<< "$COLLECT_SOURCES"
            for part in "${PARTS[@]}"; do
              if [[ "$part" != "npm" && -n "$part" ]]; then
                FILTERED="${FILTERED:+$FILTERED,}$part"
              fi
            done
          else
            FILTERED="$NON_NPM_SOURCES"
          fi
          if [[ -z "$FILTERED" ]]; then
            echo "No non-npm sources for this job"
            exit 0
          fi
          if [[ "$FILTERED" == *"npm"* ]]; then
            echo "npm lane must not run in the main collect job" >&2
            exit 1
          fi
          ARGS=(--data "$DATA_DIR" --sources "$FILTERED")
          if [[ "${{ inputs.force }}" == "true" ]]; then
            ARGS+=(--force)
          elif [[ "${IS_BACKSTOP}" == "true" || "${{ inputs.if_incomplete }}" == "true" ]]; then
            ARGS+=(--if-incomplete)
          fi
          npm run collect -- "${ARGS[@]}"

      - name: Commit snapshot to private data repo
        # Commits or stashes a dirty tree before every pull --rebase so a timeout
        # cannot leave unstaged checkpoint files and fail all retries.
        # A manifest commit is "data: snapshot <date>"; checkpoint-only is
        # "data: checkpoint <snapshotDate>".
        if: ${{ always() && github.ref == 'refs/heads/main' && inputs.seed_only != true && inputs.skip_push != true && steps.gate.outputs.skip != 'true' && steps.collect.outcome != 'skipped' }}
        working-directory: .radar-data
        run: bash "$GITHUB_WORKSPACE/scripts/push-data-repo.sh" "$GITHUB_WORKSPACE/.radar-data"

      - name: Health check
        if: ${{ inputs.seed_only != true && inputs.skip_push != true && steps.gate.outputs.skip != 'true' && steps.collect.outcome == 'success' }}
        continue-on-error: true
        env:
          DATA_DIR: ${{ env.DATA_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run health -- --data "$DATA_DIR"

      - name: Alert if today's snapshot is still missing
        if: ${{ always() && inputs.seed_only != true && inputs.skip_push != true && steps.gate.outcome == 'success' && steps.gate.outputs.skip != 'true' }}
        env:
          DATA_DIR: ${{ env.DATA_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECTOR_ISSUE_REPO: Verdent06/agentstore-radar
        run: |
          ARGS=(--data "$DATA_DIR")
          if [[ "${{ steps.collect.outcome }}" == "failure" ]]; then
            ARGS+=(--collect-failed)
          fi
          if [[ "${IS_BACKSTOP}" == "true" ]]; then
            ARGS+=(--backstop)
          fi
          npm run alert-missed -- "${ARGS[@]}"

  # One npm lane, one runner, no matrix. Runs after collect when both are in
  # the same workflow run so the two writers cannot race. The 00:20 cron skips
  # collect; this job still runs because a skipped need is allowed. The 08:47
  # and 19:23 schedules do not start this job, and the workflow concurrency
  # group keeps them from overlapping a running npm lane.
  npm:
    needs: [collect]
    if: >-
      ${{ always() &&
          (needs.collect.result == 'success' || needs.collect.result == 'skipped') &&
          (github.event.schedule == '20 0 * * *' ||
            (github.event_name == 'workflow_dispatch' &&
             inputs.seed_only != true &&
             (inputs.sources == '' || contains(inputs.sources, 'npm')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout public collector
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: Verdent06/agentstore-radar-data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          path: .radar-data
          fetch-depth: 0

      - name: Seed private repo from public data/ history
        run: bash scripts/seed-data-repo.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.radar-data"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Collect npm downloads
        id: collect
        timeout-minutes: 345
        env:
          DATA_DIR: ${{ env.DATA_DIR }}
        run: |
          ARGS=(--data "$DATA_DIR" --sources npm)
          if [[ "${{ inputs.force }}" == "true" ]]; then
            ARGS+=(--force)
          elif [[ "${{ inputs.if_incomplete }}" == "true" ]]; then
            ARGS+=(--if-incomplete)
          fi
          npm run collect -- "${ARGS[@]}"

      - name: Commit snapshot to private data repo
        if: ${{ always() && github.ref == 'refs/heads/main' && inputs.skip_push != true && steps.collect.outcome != 'skipped' }}
        working-directory: .radar-data
        run: bash "$GITHUB_WORKSPACE/scripts/push-data-repo.sh" "$GITHUB_WORKSPACE/.radar-data"
