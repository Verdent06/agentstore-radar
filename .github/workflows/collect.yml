name: Collect snapshots

on:
  schedule:
    # Primary daily collect (UTC morning).
    - cron: "17 6 * * *"
    # Same-day backstop: only collects if today's snapshot is missing or incomplete.
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      seed_only:
        description: "Copy public-repo data/ history into the private data repo; do not collect"
        type: boolean
        default: false
      if_incomplete:
        description: "Only collect if today's snapshot is missing or incomplete"
        type: boolean
        default: false

concurrency:
  group: collect-snapshots
  cancel-in-progress: false

# Read-only on the public repo so this job cannot push snapshots here.
# issues: write is for collector-missed alerts on this repo.
permissions:
  contents: read
  issues: write

env:
  DATA_REPO: Verdent06/agentstore-radar-data
  DATA_DIR: ${{ github.workspace }}/.radar-data/data
  COLLECTOR_ISSUE_REPO: Verdent06/agentstore-radar
  IS_BACKSTOP: ${{ github.event.schedule == '17 18 * * *' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    # GitHub-hosted max is 6h. Enrichment waits through npm/GitHub/PyPI resets.
    timeout-minutes: 360
    steps:
      - name: Checkout public collector
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: Verdent06/agentstore-radar-data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          path: .radar-data
          fetch-depth: 0

      - name: Seed private repo from public data/ history
        run: bash scripts/seed-data-repo.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.radar-data"

      - uses: actions/setup-node@v4
        if: ${{ inputs.seed_only != true }}
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
        if: ${{ inputs.seed_only != true }}

      - name: Collect sanctioned public snapshots
        id: collect
        if: ${{ inputs.seed_only != true }}
        timeout-minutes: 330
        env:
          DATA_DIR: ${{ env.DATA_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          ARGS=(--data "$DATA_DIR")
          if [[ "${IS_BACKSTOP}" == "true" || "${{ inputs.if_incomplete }}" == "true" ]]; then
            ARGS+=(--if-incomplete)
          fi
          npm run collect -- "${ARGS[@]}"

      - name: Commit snapshot to private data repo
        if: ${{ always() && inputs.seed_only != true && steps.collect.outcome != 'skipped' }}
        working-directory: .radar-data
        run: bash "$GITHUB_WORKSPACE/scripts/push-data-repo.sh" "$GITHUB_WORKSPACE/.radar-data"

      - name: Health check
        if: ${{ inputs.seed_only != true && steps.collect.outcome == 'success' }}
        continue-on-error: true
        env:
          DATA_DIR: ${{ env.DATA_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run health -- --data "$DATA_DIR"

      - name: Alert if today's snapshot is still missing
        if: ${{ always() && inputs.seed_only != true }}
        env:
          DATA_DIR: ${{ env.DATA_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECTOR_ISSUE_REPO: Verdent06/agentstore-radar
        run: |
          ARGS=(--data "$DATA_DIR")
          if [[ "${{ steps.collect.outcome }}" == "failure" ]]; then
            ARGS+=(--collect-failed)
          fi
          if [[ "${IS_BACKSTOP}" == "true" ]]; then
            ARGS+=(--backstop)
          fi
          npm run alert-missed -- "${ARGS[@]}"
