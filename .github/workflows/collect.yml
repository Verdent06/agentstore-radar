name: Collect snapshots

on:
  schedule:
    # One collect for every trigger. Minute 20, off the :00/:15/:30 cluster.
    # Non-npm sources run first, then npm resumes from today's checkpoint.
    # A cold scoped catalog at 1.8s is about 318 minutes, so a budget stop
    # dispatches another full collect instead of trying to finish npm here.
    # Measured non-npm core time on a cold run is about 26 minutes
    # (mcp-registry ~2m on 2026-11-03, github 24m03s in Actions job
    # 126290599753, 2026-11-04 00:07:57Z–00:31:59Z). That wall time comes out
    # of the npm recovery budget. Smithery ~6m, gemini-cli <1m, and pypi ~33m
    # run before npm as well on a cold day.
    - cron: "20 0 * * *"
    # Primary daily collect (UTC morning). Off the :00/:15/:17/:30 cluster that
    # GitHub Actions delays under load (the 06:17 job was starting ~13:08).
    # GitHub still often delivers this 6–8h late, and the 2026-11-04 05:41
    # trigger never created a run. The 08:47 cron below is the backup.
    - cron: "41 5 * * *"
    # Morning backup, off the hour. Same --if-incomplete --recover-npm collect
    # as every other trigger. Smithery, gemini-cli, and pypi do not by
    # themselves make a core-complete day run again.
    - cron: "47 8 * * *"
    # Same-day backstop. Same collect as the other schedules.
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      seed_only:
        description: "Copy public-repo data/ history into the private data repo; do not collect"
        type: boolean
        default: false
      if_incomplete:
        description: "Ignored for schedules and chained runs, which always pass --if-incomplete. Manual runs do too unless force is set."
        type: boolean
        default: true
      force:
        description: "Re-collect even if today's snapshot is already complete (overwrites that day). Ignored when chain is not 0."
        type: boolean
        default: false
      skip_push:
        description: "Collect without pushing to the private data repo (branch verification)"
        type: boolean
        default: false
      sources:
        description: "Manual only, chain 0. Comma-separated sources. npm is always recovered, never the only source."
        type: string
        default: ""
      chain:
        description: "How many chained collects already ran in this lineage. 0 for schedules. The third chained run does not dispatch another."
        type: string
        default: "0"

# One group so two writers never run together. cancel-in-progress is false,
# and GitHub keeps only one pending run. A newer schedule or chained dispatch
# replaces whatever was waiting. Every trigger is the same full collect, so
# the pending run that survives still finishes core sources and npm.
concurrency:
  group: collect-snapshots
  cancel-in-progress: false

# Read-only on the public repo so this job cannot push snapshots here.
# issues: write is for collector-missed alerts on this repo.
# actions: write lets GITHUB_TOKEN dispatch the next collect.
permissions:
  contents: read
  issues: write
  actions: write

env:
  DATA_REPO: Verdent06/agentstore-radar-data
  DATA_DIR: ${{ github.workspace }}/.radar-data/data
  COLLECTOR_ISSUE_REPO: Verdent06/agentstore-radar
  IS_BACKSTOP: ${{ github.event.schedule == '23 19 * * *' || github.event.schedule == '47 8 * * *' }}
  # npm is not in this list. --recover-npm resumes it after these sources.
  NON_NPM_SOURCES: mcp-registry,smithery,gemini-cli,github,pypi

jobs:
  collect:
    runs-on: ubuntu-latest
    # GitHub-hosted max is 6h. The collect step is 340 minutes. The other 20
    # cover checkout, the push, and the chain dispatch. npm recovery stops
    # 15 minutes before the step deadline and before 00:00 UTC.
    timeout-minutes: 360
    steps:
      - name: Checkout public collector
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: Verdent06/agentstore-radar-data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          path: .radar-data
          fetch-depth: 0

      - name: Seed private repo from public data/ history
        run: bash scripts/seed-data-repo.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.radar-data"

      - uses: actions/setup-node@v4
        if: ${{ inputs.seed_only != true }}
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
        if: ${{ inputs.seed_only != true }}

      - name: Collect sanctioned public snapshots
        id: collect
        if: ${{ inputs.seed_only != true }}
        timeout-minutes: 340
        env:
          DATA_DIR: ${{ env.DATA_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          COLLECT_SOURCES: ${{ inputs.sources }}
          NON_NPM_SOURCES: ${{ env.NON_NPM_SOURCES }}
          RADAR_COLLECT_CHAIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.chain || '0' }}
        run: |
          EVENT="${{ github.event_name }}"
          FORCE="${{ inputs.force }}"
          CHAIN="${RADAR_COLLECT_CHAIN:-0}"
          FILTERED="$NON_NPM_SOURCES"
          if [[ "$EVENT" == "workflow_dispatch" && "$CHAIN" == "0" && -n "$COLLECT_SOURCES" ]]; then
            FILTERED=""
            IFS=',' read -ra PARTS <<< "$COLLECT_SOURCES"
            for part in "${PARTS[@]}"; do
              if [[ "$part" != "npm" && -n "$part" ]]; then
                FILTERED="${FILTERED:+$FILTERED,}$part"
              fi
            done
            if [[ -z "$FILTERED" ]]; then
              echo "npm is recovered after the other sources; it cannot be the only source" >&2
              exit 1
            fi
          fi
          if [[ "$FILTERED" == *"npm"* ]]; then
            echo "npm lane must not run in the main collect source list" >&2
            exit 1
          fi
          # Step kill time. Recovery subtracts NPM_RECOVERY_MARGIN_MS (15m)
          # so the snapshot is written before Actions kills the step.
          # Non-npm work before npm reduces the time left in this deadline.
          STEP_TIMEOUT_MIN=340
          export RADAR_COLLECT_STEP_DEADLINE_MS="$(( $(date +%s) * 1000 + STEP_TIMEOUT_MIN * 60 * 1000 ))"
          if [[ "$EVENT" == "workflow_dispatch" && "$FORCE" == "true" && "$CHAIN" == "0" ]]; then
            ARGS=(--data "$DATA_DIR" --force --recover-npm --sources "$FILTERED")
          else
            ARGS=(--data "$DATA_DIR" --if-incomplete --recover-npm --sources "$FILTERED")
          fi
          npm run collect -- "${ARGS[@]}"

      - name: Commit snapshot to private data repo
        id: push
        # Commits or stashes a dirty tree before every pull --rebase so a timeout
        # cannot leave unstaged checkpoint files and fail all retries.
        # A manifest commit is "data: snapshot <date>"; checkpoint-only is
        # "data: checkpoint <snapshotDate>". A clean skip sets wrote=false and
        # does not commit.
        if: ${{ always() && github.ref == 'refs/heads/main' && inputs.seed_only != true && inputs.skip_push != true && steps.collect.outcome != 'skipped' && steps.collect.outputs.wrote != 'false' }}
        working-directory: .radar-data
        run: bash "$GITHUB_WORKSPACE/scripts/push-data-repo.sh" "$GITHUB_WORKSPACE/.radar-data"

      - name: Dispatch the next collect when npm hits its budget
        # Same concurrency group, same --if-incomplete --recover-npm collect.
        # Never an npm-only run. The collector already refused this step at
        # 23:00 UTC, on a midnight stop, when the day is complete, after a
        # no-progress run, and past 3 chained runs.
        if: ${{ steps.collect.outputs.chain_dispatch == 'true' && steps.push.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run collect.yml --ref "$GITHUB_REF_NAME" \
            -f if_incomplete=true \
            -f chain="${{ steps.collect.outputs.chain_next }}"

      - name: Health check
        if: ${{ inputs.seed_only != true && inputs.skip_push != true && steps.collect.outcome == 'success' && steps.collect.outputs.wrote != 'false' }}
        continue-on-error: true
        env:
          DATA_DIR: ${{ env.DATA_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run health -- --data "$DATA_DIR"

      - name: Alert if today's snapshot is still missing
        if: ${{ always() && inputs.seed_only != true && inputs.skip_push != true && steps.collect.outcome != 'skipped' && steps.collect.outputs.wrote != 'false' }}
        env:
          DATA_DIR: ${{ env.DATA_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECTOR_ISSUE_REPO: Verdent06/agentstore-radar
        run: |
          ARGS=(--data "$DATA_DIR")
          if [[ "${{ steps.collect.outcome }}" == "failure" ]]; then
            ARGS+=(--collect-failed)
          fi
          if [[ "${IS_BACKSTOP}" == "true" ]]; then
            ARGS+=(--backstop)
          fi
          npm run alert-missed -- "${ARGS[@]}"
