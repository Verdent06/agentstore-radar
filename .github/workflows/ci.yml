name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test --workspace=web
      - name: Build public aggregate (private data, or fixtures via explicit opt-in)
        env:
          DATA_DIR: ${{ secrets.DATA_DIR }}
          DATA_GITHUB_TOKEN: ${{ secrets.DATA_GITHUB_TOKEN }}
          DATA_REPO: Verdent06/agentstore-radar-data
        run: npm run aggregate:fixture
      - run: npm run typecheck --workspace=web
      - run: npm run build --workspace=web
      - run: npm run typecheck --workspace=mcp
      - run: npm run test --workspace=mcp
